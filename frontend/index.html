    <meta name="theme-color" content="#FF85A1" />

    <title>Anber — Lencería Premium | Tienda Online México</title>

    <meta property="og:title" content="Anber — Lencería Premium | Tienda Online México" />

    <meta property="og:site_name" content="Anber Lencería" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Descubre nuestra colección de lencería premium. Envío gratis en compras mayores a $999 MXN." />

    <!-- Structured Data: ClothingStore -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Anber Lencería",
      "url": "https://anber.store",
      "description": "Tienda de lencería premium en México. Brasieres, conjuntos íntimos, pijamas y ropa interior de alta calidad.",
      "email": "hola@anber.com",
      "telephone": "+52-55-1234-5678",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "MX",
        "addressLocality": "Ciudad de México"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "18:00"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
